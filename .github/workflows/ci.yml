name: Тестирование и развёртывание проекта

on:
  push:
    branches: [cicd]

jobs:
  tests:
    runs-on: ubuntu-24.04

    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEBUG: "0"
      ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
      DB_ENGINE: ${{ secrets.DB_ENGINE }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}

    services:
      postgres_main:
        image: postgres:12
        env:
          POSTGRES_DB: ${{ env.DB_NAME }}
          POSTGRES_USER: ${{ env.DB_USER }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
        ports:
          - 5432:5432
        options:
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Проверяем репозиторий на наличие изменений
        uses: actions/checkout@v3

      - name: Установка python и создание окружения
        uses: actions/setup-python@v3
        with:
          python-version: 3.12

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Линтинг
        run: flake8 logistic/ --exclude=logistic/migrations/

      - name: Тесты
        run: python manage.py test
        env:
          SECRET_KEY: ${{ env.SECRET_KEY }}
          DEBUG: ${{ env.DEBUG }}
          ALLOWED_HOSTS: ${{ env.ALLOWED_HOSTS }}
          DB_ENGINE: ${{ env.DB_ENGINE }}
          DB_NAME: ${{ env.DB_NAME }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          DB_HOST: ${{ env.DB_HOST }}
          DB_PORT: ${{ env.DB_PORT }}

      - name: Преобразуем SSH_HOSTS в массив
        id: matrix
        run: |
          echo "HOSTS=(${SSH_HOSTS})" >> $GITHUB_ENV  # Преобразуем строку в массив

      - name: Отладка переменных окружения
        run: |
          echo "HOSTS=${{ env.HOSTS }}"  # Проверяем, что хранится в переменной HOSTS
          echo "SSH_USER=${{ secrets.SSH_USER }}"

      - name: Деплой на хосты
        run: |
          for host in ${{ env.HOSTS }}; do
            echo "Деплой на $host"
            uses: appleboy/ssh-action@master
            with:
              host: $host  # Используем каждый хост из массива
              username: ${{ secrets.SSH_USER }}
              password: ${{ secrets.SSH_PASSWORD }}
              script: expect /home/maxim/django_cicd/deploy.exp
          done
